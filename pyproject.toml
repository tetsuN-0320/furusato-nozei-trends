[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "furusato-nozei-trends"
version = "0.1.0"
description = "ふるさと納税 人気返礼品トレンド分析"
requires-python = ">=3.11"

[tool.black]
line-length = 88
target-version = ["py311"]
# 日本語コメントを含むファイルも対象
include = '\.pyi?$'

[tool.ruff]
line-length = 88
target-version = "py311"
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long（black に委譲）
]

[tool.ruff.per-file-ignores]
"notebooks/*" = ["E402", "F401"]  # ノートブックはインポート順序を緩和

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true  # 型スタブ未整備のライブラリを無視

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: 実APIにアクセスする統合テスト（デフォルトでは除外）",
]
addopts = "-m 'not integration'"
